<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Momentos ❤️ Amor & Magia</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#b5838d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Momentos">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --palo-rosa: #b5838d;
      --palo-rosa-light: #e5989b;
      --palo-rosa-pale: #ffb5a7;
      --palo-rosa-dark: #8c5a65;
      --cream-bg: #fff0f3;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text-main: #2b2d42;
      --text-muted: #7d6f73;
      --border-color: rgba(181, 131, 141, 0.2);
      --shadow: 0 15px 35px rgba(181, 131, 141, 0.15);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 50%, #ffe5ec 100%);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating background hearts animation */
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.6); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .floating-heart {
      position: fixed;
      bottom: -20px;
      font-size: 1.5rem;
      animation: floatUp 6s linear infinite;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }

    @keyframes floatEnvelope {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.03); }
      100% { transform: translateY(0px) scale(1); }
    }

    @keyframes pulseHeart {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .browser-frame {
      max-width: 1050px;
      margin: 40px auto;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: 0 25px 60px rgba(181, 131, 141, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.8);
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    .browser-toolbar {
      background: rgba(247, 241, 242, 0.8);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .browser-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0.7;
    }
    .dot:nth-child(1) { background: #ffb5a7; }
    .dot:nth-child(2) { background: #b5838d; }
    .dot:nth-child(3) { background: #e5989b; }

    .hero-section {
      position: relative;
      background: linear-gradient(135deg, rgba(181, 131, 141, 0.9), rgba(229, 152, 155, 0.9)), url('https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      color: white;
      text-align: center;
      padding: 90px 20px;
      overflow: hidden;
    }

    .hero-section::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(to top, rgba(255,255,255,0.95), transparent);
    }

    .hero-brand {
      position: absolute;
      top: 20px;
      left: 25px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.95;
    }

    .hero-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      margin: 0;
      font-weight: 500;
      letter-spacing: 1px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: floatEnvelope 4s ease-in-out infinite;
    }

    .hero-content p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.25rem;
      margin: 12px 0 20px 0;
      opacity: 0.95;
    }

    .hero-badge {
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.7);
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .content-container {
      padding: 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
    }

    .login-container {
      max-width: 420px;
      margin: 60px auto;
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      padding: 45px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.9);
      text-align: center;
      animation: floatEnvelope 5s ease-in-out infinite;
    }

    .login-container h2 {
      font-family: 'Playfair Display', serif;
      color: var(--palo-rosa-dark);
      margin-top: 0;
      font-size: 2.2rem;
    }

    .login-container p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .user-banner {
      background: white;
      padding: 16px 24px;
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 25px rgba(181, 131, 141, 0.1);
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    .logout-btn {
      background: transparent;
      color: var(--palo-rosa);
      border: 1px solid var(--palo-rosa);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .logout-btn:hover {
      background: var(--palo-rosa);
      color: white;
      transform: translateY(-2px);
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 35px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: white;
      border: 1px solid var(--border-color);
      padding: 14px 22px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-muted);
      box-shadow: 0 4px 15px rgba(181, 131, 141, 0.08);
    }

    .tab-btn:hover {
      border-color: var(--palo-rosa);
      color: var(--palo-rosa-dark);
      transform: translateY(-3px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--palo-rosa), var(--palo-rosa-dark));
      color: white;
      border-color: transparent;
      box-shadow: 0 8px 25px rgba(181, 131, 141, 0.35);
    }

    .card {
      background: white;
      border-radius: var(--radius);
      padding: 35px;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 6px; height: 100%;
      background: linear-gradient(to bottom, var(--palo-rosa), var(--palo-rosa-pale));
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .wishlist-item {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 26px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .wishlist-item:hover {
      transform: translateY(-6px);
      border-color: var(--palo-rosa);
      box-shadow: 0 20px 40px rgba(181, 131, 141, 0.22);
    }

    button.action-btn {
      background: linear-gradient(135deg, var(--palo-rosa), var(--palo-rosa-dark));
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      width: 100%;
      margin-top: 14px;
      box-shadow: 0 6px 20px rgba(181, 131, 141, 0.3);
    }

    button.action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(181, 131, 141, 0.45);
    }

    button.secondary-btn {
      background: #fcf6f7;
      color: var(--palo-rosa-dark);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      width: 100%;
      margin-top: 8px;
    }

    button.secondary-btn:hover {
      background: #f4e8eb;
    }

    .delete-btn {
      background: transparent !important;
      color: #d90429 !important;
      border: 1px solid #ffccd5 !important;
      box-shadow: none !important;
    }

    .delete-btn:hover {
      background: #fff0f3 !important;
      border-color: #d90429 !important;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 18px;
      margin: 10px 0 20px 0;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      font-family: 'Poppins', sans-serif;
      background: #fcfafb;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--palo-rosa);
      background: white;
      box-shadow: 0 0 0 4px rgba(181, 131, 141, 0.15);
    }

    label {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .error-msg {
      color: #d90429;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      flex: 1;
      background: white;
      padding: 22px;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    .stat-card h4 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--palo-rosa);
    }

    .stat-card span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge {
      background: #f4e8eb;
      color: var(--palo-rosa-dark);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-block;
      margin-bottom: 10px;
    }

    /* Envelope Notification Styles */
    .envelope-card {
      background: linear-gradient(135deg, #fff0f3, #ffe5ec);
      border: 2px dashed var(--palo-rosa);
      border-radius: var(--radius);
      padding: 35px;
      text-align: center;
      position: relative;
      box-shadow: 0 15px 35px rgba(181, 131, 141, 0.2);
      animation: floatEnvelope 3s ease-in-out infinite;
    }

    .envelope-icon {
      font-size: 4.5rem;
      margin-bottom: 10px;
      animation: pulseHeart 2s infinite;
    }

    /* Match Modal / Screen Style */
    .match-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(43, 45, 66, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .match-modal {
      background: linear-gradient(135deg, #2b2d42, #1a1b26);
      color: white;
      padding: 50px 40px;
      border-radius: 28px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 30px 70px rgba(0,0,0,0.6);
      border: 2px solid var(--palo-rosa);
      animation: floatEnvelope 4s ease-in-out infinite;
    }

    .match-modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: var(--palo-rosa-pale);
      margin: 0 0 10px 0;
    }

    .couple-circles {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 25px 0;
    }

    .couple-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--palo-rosa);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      border: 4px solid white;
      box-shadow: 0 8px 25px rgba(181, 131, 141, 0.5);
    }
    /* ===== Experiencia romántica ===== */
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 4px 15px rgba(181,131,141,0.3); }
      50%      { box-shadow: 0 6px 30px rgba(229,152,155,0.75); }
    }
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.85) translateY(24px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes quoteIn {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    @keyframes burst {
      0%   { transform: translate(0, 0) scale(0.4); opacity: 1; }
      100% { transform: translate(var(--dx), -150px) scale(1.25) rotate(25deg); opacity: 0; }
    }
    @keyframes heroIn {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: none; }
    }

    body {
      background: linear-gradient(120deg, #fff5f7, #fdfbfb, #ffeef2, #fdf6f0);
      background-size: 300% 300%;
      animation: gradientShift 18s ease infinite;
    }

    .browser-frame {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 25px 70px rgba(181,131,141,0.25);
      animation: fadeUp 0.8s ease backwards;
    }

    .hero-section {
      animation: heroIn 0.9s ease backwards;
    }

    .hero-names {
      font-family: 'Dancing Script', cursive !important;
      font-size: 4.2rem !important;
      font-weight: 700;
      line-height: 1.1;
      background: linear-gradient(90deg, #ffffff, #ffd6e0, #ffffff, #ffd6e0, #ffffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 5s linear infinite;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.25));
    }

    .hero-quote {
      min-height: 2.4em;
      animation: quoteIn 0.8s ease backwards;
    }

    .hero-badge {
      animation: glowPulse 3s ease-in-out infinite;
    }

    .tab-panel {
      animation: fadeUp 0.6s ease backwards;
    }

    .tab-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(181,131,141,0.25);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #e5989b, #b5838d);
      animation: glowPulse 2.5s ease-in-out infinite;
    }

    .stat-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px) rotate(-1deg);
      box-shadow: 0 16px 35px rgba(229,152,155,0.35);
    }

    .grid > * {
      animation: fadeUp 0.6s ease backwards;
    }
    .grid > *:nth-child(2) { animation-delay: 0.08s; }
    .grid > *:nth-child(3) { animation-delay: 0.16s; }
    .grid > *:nth-child(4) { animation-delay: 0.24s; }
    .grid > *:nth-child(5) { animation-delay: 0.32s; }
    .grid > *:nth-child(6) { animation-delay: 0.40s; }

    .wishlist-item > div:first-child > div:first-child {
      animation: floatEnvelope 4s ease-in-out infinite;
    }

    .match-modal {
      animation: popIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
    }

    button.action-btn {
      background: linear-gradient(135deg, #e5989b, #b5838d);
    }
    button.action-btn:hover {
      background: linear-gradient(135deg, #b5838d, #8c5a65);
      transform: translateY(-2px);
    }
    button.action-btn:active {
      transform: scale(0.98);
    }

    .user-banner {
      background: linear-gradient(135deg, rgba(255,255,255,0.97), #fff0f3);
    }

    .mural-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 26px;
      margin-top: 24px;
    }

    .sticky-note {
      position: relative;
      padding: 30px 20px 14px 20px;
      min-height: 170px;
      border-radius: 4px 4px 18px 4px;
      box-shadow: 0 10px 22px rgba(120, 80, 90, 0.18);
      transform: rotate(var(--rot, 0deg));
      animation: fadeUp 0.6s ease backwards;
      display: flex;
      flex-direction: column;
    }

    .sticky-note:hover {
      transform: rotate(0deg) scale(1.05);
      z-index: 2;
      box-shadow: 0 16px 30px rgba(120, 80, 90, 0.25);
    }

    .sticky-note .pin {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    }

    .sticky-note p {
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.25;
      color: #4a3038;
      margin: 4px 0 14px 0;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }

    .note-foot {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #7d6f73;
      gap: 8px;
    }

    .note-del {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      color: #8c5a65;
      font-size: 0.9rem;
      opacity: 0.5;
    }
    .note-del:hover { opacity: 1; }

    .love-meter { text-align: left; }
    .meter-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0 6px 0;
    }
    .heart-svg {
      width: 200px;
      height: 200px;
      max-width: 60vw;
      animation: pulseHeart 2s ease-in-out infinite;
      filter: drop-shadow(0 10px 25px rgba(201, 24, 74, 0.25));
    }
    .meter-num {
      font-family: 'Dancing Script', cursive;
      font-size: 3.4rem;
      font-weight: 700;
      color: #c9184a;
      line-height: 1;
      margin-top: -6px;
    }
    .meter-msg {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--palo-rosa-dark);
      text-align: center;
      margin: 8px 0 0 0;
    }
    .meter-parts {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }
    .meter-bar {
      height: 12px;
      border-radius: 10px;
      background: #f7e1e6;
      overflow: hidden;
    }
    .meter-bar span {
      display: block;
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, #ffb3c6, #c9184a);
      transition: width 1.2s ease;
    }

    .love-msg {
      margin-top: 22px;
      padding: 22px;
      border-radius: 20px;
      background: linear-gradient(135deg, #fff0f3, #ffe5ec);
      border: 1px solid var(--palo-rosa-light);
      animation: popIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
    }
    .love-msg p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--palo-rosa-dark);
      margin: 0 0 16px 0;
    }

    .click-heart {
      position: fixed;
      top: 0;
      pointer-events: none;
      z-index: 9999;
      font-size: 22px;
      animation: burst 1.3s ease-out forwards;
    }

    /* ===== Chat ===== */
    .chat-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .chat-title { margin: 0; font-family: 'Playfair Display', serif; color: var(--palo-rosa-dark); font-weight: 600; font-size: 1.4rem; }
    .chat-sub { font-size: 0.85rem; color: var(--text-muted); }
    .streak-badge {
      display: flex; align-items: center; gap: 6px;
      background: #fff0f3; border: 2px solid var(--palo-rosa-light);
      padding: 8px 16px; border-radius: 30px; font-weight: 700; color: #c9184a;
    }
    .streak-badge.on {
      background: linear-gradient(135deg, #ffb3c6, #e5989b); color: white; border-color: transparent;
      box-shadow: 0 6px 20px rgba(201, 24, 74, 0.35); animation: glowPulse 2.5s ease-in-out infinite;
    }
    .streak-icon { font-size: 1.4rem; display: inline-block; animation: pulseHeart 1.8s ease-in-out infinite; }
    .streak-num { font-family: 'Dancing Script', cursive; font-size: 1.5rem; line-height: 1; }
    .streak-hint { font-size: 0.85rem; color: var(--text-muted); font-style: italic; margin: 10px 0 16px 0; }
    .chat-messages {
      height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
      background: linear-gradient(180deg, #fff7f9, #fff0f3); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 18px;
    }
    .chat-empty { margin: auto; color: var(--text-muted); font-style: italic; }
    .chat-row { display: flex; }
    .chat-row.mine { justify-content: flex-end; }
    .chat-row.theirs { justify-content: flex-start; }
    .chat-bubble {
      max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4;
      word-break: break-word; white-space: pre-wrap; display: flex; flex-direction: column;
      box-shadow: 0 3px 10px rgba(181, 131, 141, 0.15);
    }
    .chat-row.mine .chat-bubble { background: linear-gradient(135deg, #e5989b, #b5838d); color: white; border-bottom-right-radius: 6px; }
    .chat-row.theirs .chat-bubble { background: white; color: var(--text-main); border-bottom-left-radius: 6px; }
    .chat-bubble small { font-size: 0.65rem; opacity: 0.75; align-self: flex-end; margin-top: 4px; }
    .chat-bubble.big { background: none !important; box-shadow: none; font-size: 2.6rem; padding: 4px 6px; color: var(--text-main) !important; }
    .chat-bubble.big small { color: var(--text-muted); }
    .emoji-picker {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px;
      background: white; border: 1px solid var(--border-color); border-radius: 16px;
      padding: 10px; margin-top: 12px; max-height: 160px; overflow-y: auto;
    }
    .emoji-picker button, .quick-react button, .emoji-toggle {
      background: none; border: none; cursor: pointer; font-size: 1.4rem; padding: 4px; border-radius: 10px;
    }
    .emoji-picker button:hover, .quick-react button:hover, .emoji-toggle:hover { background: #fff0f3; transform: scale(1.15); }
    .quick-react { display: flex; gap: 6px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    .chat-input { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .chat-input input { margin: 0; border-radius: 24px; }
    .send-btn { width: auto !important; margin: 0 !important; padding: 12px 18px !important; border-radius: 50% !important; }

    .apk-link {
      display: inline-block; margin-top: 14px; font-size: 0.85rem; color: var(--palo-rosa-dark);
      text-decoration: none; border: 1px dashed var(--palo-rosa); padding: 8px 16px;
      border-radius: 20px; background: white;
    }
    .apk-link:hover { background: #fff0f3; }
    .banner-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* ===== Celulares (diseño responsivo) ===== */
    .card, .wishlist-item, .envelope-card, .sticky-note, .user-banner, .chat-bubble, .hero-content {
      overflow-wrap: anywhere;
    }

    @media (max-width: 640px) {
      /* App a pantalla completa: sin marco de navegador ni puntitos */
      .browser-frame {
        margin: 0; border-radius: 0; box-shadow: none; border: none;
        background: transparent; backdrop-filter: none; overflow: visible;
      }
      .browser-toolbar { display: none; }

      .hero-section {
        padding: calc(env(safe-area-inset-top, 0px) + 56px) 18px 34px !important;
        border-radius: 0 0 28px 28px;
      }
      .hero-brand { font-size: 0.7rem; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 18px; }

      .content-container {
        background: transparent; backdrop-filter: none;
        padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 28px);
      }
      .login-container { margin: 18px 0 0; }

      /* Barra de usuario ordenada: nombre arriba, acciones abajo */
      .user-banner { flex-direction: column; align-items: stretch; gap: 12px; text-align: center; border-radius: 20px; }
      .user-banner > span { font-size: 0.92rem; line-height: 1.4; }
      .banner-actions { justify-content: center; }
      .banner-actions .logout-btn, .banner-actions .apk-link { margin: 0; }

      .hero-section { padding-top: calc(env(safe-area-inset-top, 0px) + 56px) !important; }
      .hero-names { font-size: 2.6rem !important; line-height: 1.15; }
      .hero-content p { font-size: 1rem; margin: 8px 0 14px 0; }
      .hero-quote { min-height: 2.8em; }
      .hero-badge { font-size: 0.7rem; padding: 6px 14px; letter-spacing: 1px; }

      .content-container { padding: 16px; }

      .user-banner { flex-wrap: wrap; gap: 10px; padding: 14px 16px; margin-bottom: 18px; }
      .user-banner span { font-size: 0.9rem; }

      .stats-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
      .stat-card { padding: 14px 10px; }
      .stat-card h4 { font-size: 1.6rem; }
      .stat-card span { font-size: 0.78rem; }

      /* Pestañas: una fila que se desliza con el dedo, sin partirse en varias líneas */
      .tabs {
        flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto;
        gap: 8px; margin: 0 -16px 20px; padding: 4px 16px 10px;
        scrollbar-width: none; -webkit-overflow-scrolling: touch;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab-btn { flex-shrink: 0; white-space: nowrap; padding: 10px 14px; font-size: 0.82rem; border-radius: 16px; }

      .card { padding: 20px; margin-bottom: 20px; border-radius: 20px; }
      .card h3 { font-size: 1.15rem !important; }
      .card::before { width: 4px; }

      /* min(...) evita que una columna de 280px desborde la pantalla de 320px */
      .grid { grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 16px; }
      .wishlist-item { padding: 20px; }
      .mural-grid { grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 16px; }
      .sticky-note { min-height: 140px; }
      .sticky-note p { font-size: 1.25rem; }

      .login-container { margin: 20px auto; padding: 26px 20px; }
      .login-container h2 { font-size: 1.8rem; }

      .envelope-card { padding: 22px 16px; }
      .envelope-icon { font-size: 3.5rem; }

      .match-modal { padding: 30px 20px; }
      .match-modal h2 { font-size: 2.2rem; }
      .couple-circle { width: 80px; height: 80px; font-size: 2rem; }

      .heart-svg { width: 160px; height: 160px; }
      .meter-num { font-size: 2.8rem; }
      .love-msg p { font-size: 1rem; }

      /* 16px evita que el celular haga zoom al escribir */
      input, select, textarea { font-size: 16px; padding: 12px 14px; margin: 8px 0 14px 0; }

      .chat-messages { height: 58vh; min-height: 300px; padding: 12px; }
      .chat-bubble { max-width: 82%; }
      .chat-title { font-size: 1.2rem; }
      .emoji-picker { grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); }
      .quick-react button { font-size: 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Floating hearts generator -->
  <div class="floating-heart" style="left: 10%; animation-delay: 0s;">💖</div>
  <div class="floating-heart" style="left: 30%; animation-delay: 2s;">✨</div>
  <div class="floating-heart" style="left: 50%; animation-delay: 1s;">❤️</div>
  <div class="floating-heart" style="left: 70%; animation-delay: 3s;">🌸</div>
  <div class="floating-heart" style="left: 90%; animation-delay: 1.5s;">💖</div>

  <div id="root"></div>

  <script>
    // Corazones que brotan donde haces clic
    document.addEventListener('click', (e) => {
      const emojis = ['💖', '💕', '✨', '🌸', '❤️'];
      for (let i = 0; i < 6; i++) {
        const s = document.createElement('span');
        s.className = 'click-heart';
        s.textContent = emojis[i % emojis.length];
        s.style.left = (e.clientX - 11 + (Math.random() * 40 - 20)) + 'px';
        s.style.top = (e.clientY - 11) + 'px';
        s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1400);
      }
    });
  </script>
  <script type="text/babel">
    const CORAZON_PATH = "M12 21s-7.5-4.6-9.9-9.2C.4 8.4 2.2 4 6.4 4c2.3 0 3.9 1.3 5.6 3.3C13.7 5.3 15.3 4 17.6 4c4.2 0 6 4.4 4.3 7.8C19.5 16.4 12 21 12 21z";

    function frasePorcentaje(score) {
      if (score <= 20) return "Una historia que apenas empieza 🌱 ¡Agenden su primera cita!";
      if (score <= 40) return "El amor va despertando 🌷 Escríbanse una notita hoy";
      if (score <= 60) return "Están creciendo juntos 💕 Sigan así";
      if (score <= 80) return "¡Qué bonita conexión! Cada día se nota más 💞";
      if (score < 100) return "Casi en el cielo del amor ✨";
      return "Amor infinito ∞ Lo que tienen es único 💖";
    }

    const SOLO_EMOJI = /^[\p{Extended_Pictographic}️‍\s]+$/u;

    // ===== Notificaciones push =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.warn('Service worker no disponible', err));
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    // permPromise se pide al tocar "Entrar" (el navegador exige un clic para mostrar el permiso)
    async function enablePush(userName, permPromise) {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
        const perm = permPromise ? await permPromise : Notification.permission;
        if (perm !== 'granted') return;
        const reg = await navigator.serviceWorker.ready;
        const { publicKey } = await (await fetch('/api/push/key')).json();
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
        }
        await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: userName, subscription: sub.toJSON() })
        });
      } catch (err) {
        console.warn('No se pudieron activar las notificaciones', err);
      }
    }

    function formatHora(iso) {
      return new Date(iso).toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
    }

    function ChatPanel({ messages, streak, me, partnerNick, chatText, setChatText, showEmojis, setShowEmojis, chatRef, emojis, quick, onSend }) {
      // Baja automáticamente al último mensaje cuando llega uno nuevo
      React.useEffect(() => {
        if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
      }, [messages.length]);

      const hint = streak.count === 0
        ? 'Escríbanse hoy los dos para empezar su racha 💘'
        : streak.todayDone
          ? `¡Racha de ${streak.count} ${streak.count === 1 ? 'día' : 'días'}! Mañana sigan así 💘`
          : `¡Escríbanse hoy para no perder su racha de ${streak.count} ${streak.count === 1 ? 'día' : 'días'}! ⏳`;

      const handleSubmit = async (e) => {
        e.preventDefault();
        const text = chatText;
        setChatText('');
        setShowEmojis(false);
        const ok = await onSend(text);
        if (!ok) setChatText(text);
      };

      return (
        <div className="card">
          <div className="chat-header">
            <div>
              <h3 className="chat-title">💬 Nuestro Chat</h3>
              <span className="chat-sub">Hablando con {partnerNick}</span>
            </div>
            <div className={`streak-badge ${streak.todayDone ? 'on' : ''}`} title="Racha: los dos deben escribir cada día">
              <span className="streak-icon">💘</span>
              <span className="streak-num">{streak.count}</span>
            </div>
          </div>
          <p className="streak-hint">{hint}</p>

          <div className="chat-messages" ref={chatRef}>
            {messages.length === 0 && <p className="chat-empty">Aún no hay mensajes. ¡Escribe el primero! 💕</p>}
            {messages.map(m => {
              const mine = m.author === me;
              const big = m.text.length <= 12 && SOLO_EMOJI.test(m.text);
              return (
                <div key={m.id} className={`chat-row ${mine ? 'mine' : 'theirs'}`}>
                  <div className={`chat-bubble ${big ? 'big' : ''}`}>
                    <span>{m.text}</span>
                    <small>{formatHora(m.createdAt)}</small>
                  </div>
                </div>
              );
            })}
          </div>

          {showEmojis && (
            <div className="emoji-picker">
              {emojis.map(em => (
                <button type="button" key={em} onClick={() => setChatText(t => t + em)}>{em}</button>
              ))}
            </div>
          )}

          <div className="quick-react">
            {quick.map(em => (
              <button type="button" key={em} onClick={() => onSend(em)} title="Enviar">{em}</button>
            ))}
          </div>

          <form className="chat-input" onSubmit={handleSubmit}>
            <button type="button" className="emoji-toggle" onClick={() => setShowEmojis(s => !s)} title="Emojis">😊</button>
            <input type="text" value={chatText} onChange={e => setChatText(e.target.value)} placeholder="Escribe un mensaje..." maxLength={1000} />
            <button className="action-btn send-btn" type="submit" title="Enviar">➤</button>
          </form>
        </div>
      );
    }

    function Corazometro({ score, parts, partnerNick, myNick }) {
      const [num, setNum] = React.useState(0);

      React.useEffect(() => {
        let n = 0;
        const step = Math.max(1, Math.ceil(score / 40));
        const t = setInterval(() => {
          n = Math.min(score, n + step);
          setNum(n);
          if (n >= score) clearInterval(t);
        }, 35);
        return () => clearInterval(t);
      }, [score]);

      // El corazón se llena de abajo hacia arriba según el porcentaje
      const fillY = 24 - (num / 100) * 24;

      return (
        <div className="card love-meter">
          <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)', textAlign: 'center'}}>💗 Corazómetro del Amor</h3>
          <p style={{color: 'var(--text-muted)', fontSize: '0.92rem', textAlign: 'center', marginTop: 0}}>
            Mide la conexión de {myNick} & {partnerNick} según cuánto se buscan, se escriben y se agendan citas.
          </p>

          <div className="meter-wrap">
            <svg viewBox="0 0 24 24" className="heart-svg" aria-hidden="true">
              <defs>
                <linearGradient id="loveGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#ffb3c6" />
                  <stop offset="100%" stopColor="#c9184a" />
                </linearGradient>
                <clipPath id="heartClip"><path d={CORAZON_PATH} /></clipPath>
              </defs>
              <path d={CORAZON_PATH} fill="#f7e1e6" />
              <g clipPath="url(#heartClip)">
                <rect x="0" y={fillY} width="24" height="24" fill="url(#loveGrad)" />
              </g>
              <path d={CORAZON_PATH} fill="none" stroke="#b5838d" strokeWidth="0.35" />
            </svg>
            <div className="meter-num">{num}%</div>
            <p className="meter-msg">{frasePorcentaje(score)}</p>
          </div>

          <div className="meter-parts">
            {parts.map(p => (
              <div key={p.label}>
                <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '0.85rem', marginBottom: '5px'}}>
                  <span>{p.icon} {p.label}</span>
                  <span style={{color: 'var(--text-muted)'}}>{p.value}/{p.max}</span>
                </div>
                <div className="meter-bar"><span style={{width: `${(p.value / p.max) * 100}%`}}></span></div>
              </div>
            ))}
          </div>
          <p style={{fontSize: '0.75rem', color: 'var(--text-muted)', textAlign: 'center', marginTop: '18px', fontStyle: 'italic'}}>
            Cada citas, cartita, notita o día compartido suma al amor 💕
          </p>
        </div>
      );
    }

    function App() {
      const [user, setUser] = React.useState(null);
      const [usernameInput, setUsernameInput] = React.useState('');
      const [passwordInput, setPasswordInput] = React.useState('');
      const [showPassword, setShowPassword] = React.useState(false);
      const [loginError, setLoginError] = React.useState('');

      const [activeTab, setActiveTab] = React.useState('wishlist');
      const [data, setData] = React.useState({ wishlist: [], freeDays: [], proposals: [], matches: [], chat: [], streak: { count: 0, todayDone: false }, connection: { status: 'connected' }, nicknames: {} });

      // Form states
      const [newTitle, setNewTitle] = React.useState('');
      const [newDesc, setNewDesc] = React.useState('');
      const [newCategory, setNewCategory] = React.useState('Restaurante');
      const [selectedDate, setSelectedDate] = React.useState('');
      const [proposalPlace, setProposalPlace] = React.useState('');
      const [proposalDate, setProposalDate] = React.useState('');
      const [proposalMessage, setProposalMessage] = React.useState('');
      const [myNickname, setMyNickname] = React.useState('');
      const [partnerNickInput, setPartnerNickInput] = React.useState('');
      const [loveMsg, setLoveMsg] = React.useState('');
      const [noteText, setNoteText] = React.useState('');
      const [noteColor, setNoteColor] = React.useState('#ffd6e0');
      const NOTE_COLORS = ['#ffd6e0', '#ffe8d6', '#fff3b0', '#d8f3dc', '#e0d4f7', '#cfe8ff'];
      const [showMatchModal, setShowMatchModal] = React.useState(false);
      const [latestMatch, setLatestMatch] = React.useState(null);
      const [quoteIdx, setQuoteIdx] = React.useState(0);
      const [editingId, setEditingId] = React.useState(null);
      const [editTitle, setEditTitle] = React.useState('');
      const [editDesc, setEditDesc] = React.useState('');
      const [editCategory, setEditCategory] = React.useState('Restaurante');
      const [chatText, setChatText] = React.useState('');
      const [showEmojis, setShowEmojis] = React.useState(false);
      const chatRef = React.useRef(null);
      const CHAT_EMOJIS = ['😀','😍','🥰','😘','😂','🥺','😊','😎','🤗','😉','😴','🤔','😭','🥳','😤','🙈','😋','🤭','💕','💖','❤️','🧡','💛','💚','💙','💜','🖤','💔','💌','🌹','🌸','🌷','🌟','✨','🔥','🎉','🎁','🍫','☕','🍕','🍝','🌙','☀️','🐻','🐱','👀','🙏','👍','👏'];
      const CHAT_QUICK = ['❤️','😘','🥰','😂','🥺','🔥'];
      const frases = [
        "Contigo, cada día es una cita especial ❤️",
        "Eres mi lugar favorito en el mundo ✨",
        "Juntos hacemos de cada momento una historia 💌",
        "Mi parte favorita del día es estar contigo 🌸",
        "Te quiero más que ayer y menos que mañana 💖"
      ];
      React.useEffect(() => {
        const t = setInterval(() => setQuoteIdx(i => (i + 1) % frases.length), 4500);
        return () => clearInterval(t);
      }, []);

      const partnerName = user?.name === 'Michael Milla' ? 'Mirella Garcia' : 'Michael Milla';
      const myNick = user ? (data.nicknames?.[user.name] || user.name) : '';
      const partnerNick = data.nicknames?.[partnerName] || partnerName;

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        // Se pide el permiso de notificaciones dentro del clic, antes de cualquier await
        const permPromise = ('Notification' in window && Notification.permission === 'default')
          ? Notification.requestPermission()
          : null;
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usernameInput, password: passwordInput })
          });
          const json = await res.json();
          if (json.success) {
            enablePush(json.name, permPromise);
            setUser({ username: json.username, name: json.name });
            setMyNickname('');
            setPartnerNickInput('');
          } else {
            setLoginError(json.error || 'Credenciales inválidas');
          }
        } catch (err) {
          setLoginError('Error al conectar con el servidor');
        }
      };

      const fetchData = async () => {
        try {
          const res = await fetch('/api/data');
          const json = await res.json();
          setData(json);
        } catch (e) {
          console.error("Error cargando datos", e);
        }
      };

      React.useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 3000);
        return () => clearInterval(interval);
      }, []);

      if (!user) {
        return (
          <div className="browser-frame">
            <div className="browser-toolbar">
              <div className="browser-dots">
                <div className="dot"></div>
                <div className="dot"></div>
                <div className="dot"></div>
              </div>
            </div>
            <div className="hero-section" style={{padding: '70px 20px'}}>
              <div className="hero-brand">MOMENTOS</div>
              <div className="hero-content">
                <h1>Momentos</h1>
                <p>Inicia sesión para planear tus citas con amor y elegancia</p>
                <div className="hero-badge">CONEXIÓN DE NOVIOS ❤️</div>
              </div>
            </div>
            <div className="content-container">
              <div className="login-container">
                <div style={{fontSize: '3rem', marginBottom: '10px', animation: 'pulseHeart 2s infinite'}}>💖</div>
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales para acceder a vuestro espacio</p>
                <form onSubmit={handleLogin}>
                  <input type="text" placeholder="Usuario (ej. mmilla o mgarcia)" value={usernameInput} onChange={e => setUsernameInput(e.target.value)} required />
                  <div style={{position: 'relative', display: 'flex', alignItems: 'center'}}>
                    <input type={showPassword ? "text" : "password"} placeholder="Contraseña" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} required style={{paddingRight: '45px'}} />
                    <button type="button" onClick={() => setShowPassword(!showPassword)} style={{position: 'absolute', right: '15px', top: '42%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', fontSize: '1.2rem'}}>
                      {showPassword ? '👁️‍🗨️' : '👁️'}
                    </button>
                  </div>
                  <button className="action-btn" type="submit" style={{marginTop: '15px'}}>Entrar con Amor ❤️</button>
                  {loginError && <div className="error-msg">{loginError}</div>}
                </form>
                <div>
                  <a className="apk-link" href="/nuestros-momentos.apk" download>📲 Descargar app para Android (APK)</a>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const addWishlistItem = async (e) => {
        e.preventDefault();
        if (!newTitle) return;
        const iconMap = { 'Restaurante': '🍝', 'Viaje': '🌊', 'Café': '☕', 'Paseo': '🌸' };
        await fetch('/api/wishlist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle, description: newDesc, category: newCategory, image: iconMap[newCategory] || '❤️', addedBy: myNick })
        });
        setNewTitle('');
        setNewDesc('');
        fetchData();
      };

      const deleteWishlistItem = async (id) => {
        if (!confirm('¿Estás seguro de eliminar este lugar de la wishlist?')) return;
        try {
          const res = await fetch(`/api/wishlist/${id}`, { method: 'DELETE' });
          const json = await res.json();
          if (json.success) {
            setData(prev => ({ ...prev, wishlist: json.wishlist }));
          } else {
            fetchData();
          }
        } catch (e) {
          console.error("Error al eliminar wishlist", e);
          fetchData();
        }
      };

      const startEditWishlist = (item) => {
        setEditingId(item.id);
        setEditTitle(item.title || '');
        setEditDesc(item.description || '');
        setEditCategory(item.category || 'Restaurante');
      };

      const saveWishlistEdit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`/api/wishlist/${editingId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: editTitle, description: editDesc, category: editCategory })
          });
          const json = await res.json();
          if (json.success) {
            setData(prev => ({ ...prev, wishlist: json.wishlist }));
            setEditingId(null);
          } else {
            fetchData();
          }
        } catch (err) {
          console.error("Error al editar wishlist", err);
          fetchData();
        }
      };

      const markFreeDay = async (e) => {
        e.preventDefault();
        if (!selectedDate) return;
        await fetch('/api/freedays', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: myNick, date: selectedDate })
        });
        setSelectedDate('');
        fetchData();
      };

      const sendProposal = async (e) => {
        e.preventDefault();
        if (!proposalPlace || !proposalDate) return;
        await fetch('/api/proposals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender: myNick, receiver: partnerName, place: proposalPlace, date: proposalDate, message: proposalMessage })
        });
        setProposalPlace('');
        setProposalDate('');
        setProposalMessage('');
        setActiveTab('proposals');
        fetchData();
      };

      const respondProposal = async (id, action) => {
        const res = await fetch(`/api/proposals/${id}/respond`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action })
        });
        const json = await res.json();
        if (action === 'accept') {
          setLatestMatch(json);
          setShowMatchModal(true);
        }
        fetchData();
      };

      const deleteMatch = async (id) => {
        if (!confirm('¿Estás seguro de que deseas eliminar esta cita oficial?')) return;
        try {
          const res = await fetch(`/api/matches/${id}`, { method: 'DELETE' });
          const json = await res.json();
          if (json.success) {
            setData(prev => ({ ...prev, matches: json.matches }));
          } else {
            fetchData();
          }
        } catch (e) {
          console.error("Error al eliminar match", e);
          fetchData();
        }
      };

      const addNote = async (e) => {
        e.preventDefault();
        if (!noteText.trim()) return;
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: noteText, author: myNick, color: noteColor })
        });
        const json = await res.json();
        if (json.success) {
          setData(prev => ({ ...prev, notes: json.notes }));
          setNoteText('');
        } else {
          alert(json.error || 'No se pudo pegar la notita');
        }
      };

      const deleteNote = async (id) => {
        if (!confirm('¿Quitar esta notita del mural?')) return;
        const res = await fetch(`/api/notes/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) setData(prev => ({ ...prev, notes: json.notes }));
      };

      // Enviar un mensaje (texto o emoji). Devuelve true si se guardó.
      const sendChat = async (text) => {
        const clean = String(text || '').trim();
        if (!clean) return false;
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ author: user.name, text: clean })
          });
          const json = await res.json();
          if (json.success) {
            setData(prev => ({ ...prev, chat: json.chat, streak: json.streak }));
            return true;
          }
          alert(json.error || 'No se pudo enviar el mensaje');
          return false;
        } catch (err) {
          alert('Error de conexión al enviar el mensaje');
          return false;
        }
      };

      const updateNickname = async (e) => {
        e.preventDefault();
        const headers = { 'Content-Type': 'application/json' };
        const requests = [];
        // Apodo que TÚ le pones a tu pareja
        if (partnerNickInput.trim()) {
          requests.push(fetch('/api/nicknames', {
            method: 'POST', headers,
            body: JSON.stringify({ user: partnerName, nickname: partnerNickInput.trim() })
          }));
        }
        // Apodo que tu pareja te pone a ti
        if (myNickname.trim()) {
          requests.push(fetch('/api/nicknames', {
            method: 'POST', headers,
            body: JSON.stringify({ user: user.name, nickname: myNickname.trim() })
          }));
        }
        await Promise.all(requests);
        setPartnerNickInput('');
        alert('¡Apodos cariñosos actualizados con éxito! ❤️');
        fetchData();
      };

      const disconnectCouple = () => {
        // Esta acción ya no elimina nada: solo muestra el mensaje de amor
        setLoveMsg('Es imposible romper esta relación, porque es más fuerte cada día. 💖 Nada ni nadie puede borrar lo que estamos construyendo juntos.');
      };

      const myProposals = data.proposals.filter(p => p.receiver === user.name && p.status === 'pending');

      // Corazómetro: suma de interacciones (máximo 100)
      const calcLove = () => {
        const nicks = data.nicknames || {};
        const apodosPuestos = Object.keys(nicks).filter(k => nicks[k] && nicks[k] !== k).length;
        const parts = [
          { label: 'Citas agendadas', icon: '💍', value: Math.min((data.matches || []).length * 6, 30), max: 30 },
          { label: 'Cartitas enviadas', icon: '💌', value: Math.min((data.proposals || []).length * 3, 15), max: 15 },
          { label: 'Notitas en el mural', icon: '🧷', value: Math.min((data.notes || []).length * 2, 20), max: 20 },
          { label: 'Días libres compartidos', icon: '📅', value: Math.min((data.freeDays || []).length * 2, 10), max: 10 },
          { label: 'Sueños en la lista', icon: '✨', value: Math.min((data.wishlist || []).length * 2, 10), max: 10 },
          { label: 'Apodos cariñosos', icon: '🥰', value: apodosPuestos >= 2 ? 15 : apodosPuestos * 7, max: 15 }
        ];
        const score = Math.min(100, parts.reduce((s, p) => s + p.value, 0));
        return { score, parts };
      };

      return (
        <div className="browser-frame">
          {showMatchModal && (
            <div className="match-modal-overlay">
              <div className="match-modal">
                <div style={{fontSize: '3.5rem', marginBottom: '15px', animation: 'pulseHeart 1.5s infinite'}}>💖</div>
                <h2>¡It's a Match!</h2>
                <p style={{color: '#f4acb7', fontSize: '1.1rem', fontStyle: 'italic'}}>¡Has aceptado con amor la propuesta de {partnerNick}!</p>
                <div className="couple-circles">
                  <div className="couple-circle">👩‍❤️‍👨</div>
                </div>
                <p style={{fontSize: '0.95rem', color: '#d1d5db', marginBottom: '30px'}}>Su hermosa cita en <strong>{latestMatch?.place}</strong> para el <strong>{latestMatch?.date}</strong> ha quedado oficializada. ✨</p>
                <button className="action-btn" style={{background: 'var(--palo-rosa)', padding: '14px'}} onClick={() => { setShowMatchModal(false); setActiveTab('matches'); }}>
                  Ver Cita Confirmada 🌟
                </button>
              </div>
            </div>
          )}

          <div className="browser-toolbar">
            <div className="browser-dots">
              <div className="dot"></div>
              <div className="dot"></div>
              <div className="dot"></div>
            </div>
          </div>

          <div className="hero-section">
            <div className="hero-brand">MOMENTOS</div>
            <div className="hero-content">
              <h1 className="hero-names">{myNick} & {partnerNick}</h1>
              <p className="hero-quote" key={quoteIdx}>{frases[quoteIdx]}</p>
              <div className="hero-badge">AMOR VERDADERO ❤️</div>
            </div>
          </div>

          <div className="content-container">
            <div className="user-banner">
              <span>👤 Conectado como: <strong>{myNick}</strong> ({user.name})</span>
              <div className="banner-actions">
                <a className="apk-link" href="/nuestros-momentos.apk" download style={{marginTop: 0}}>📲 APK Android</a>
                <button className="logout-btn" onClick={() => setUser(null)}>Cerrar Sesión</button>
              </div>
            </div>

            <div className="stats-bar">
              <div className="stat-card">
                <h4>{data.wishlist.length}</h4>
                <span>Wishlist</span>
              </div>
              <div className="stat-card">
                <h4>{data.freeDays.length}</h4>
                <span>Días Libres</span>
              </div>
              <div className="stat-card">
                <h4>{data.matches.length}</h4>
                <span>Citas Match</span>
              </div>
              <div className="stat-card">
                <h4>💘 {data.streak?.count || 0}</h4>
                <span>Racha de días</span>
              </div>
            </div>

            <div className="tabs">
              <button className={`tab-btn ${activeTab === 'connection' ? 'active' : ''}`} onClick={() => setActiveTab('connection')}>💍 Conexión Novios</button>
              <button className={`tab-btn ${activeTab === 'wishlist' ? 'active' : ''}`} onClick={() => setActiveTab('wishlist')}>✨ Wishlist</button>
              <button className={`tab-btn ${activeTab === 'freedays' ? 'active' : ''}`} onClick={() => setActiveTab('freedays')}>📅 Días Libres</button>
              <button className={`tab-btn ${activeTab === 'propose' ? 'active' : ''}`} onClick={() => setActiveTab('propose')}>💌 Proponer Cita</button>
              <button className={`tab-btn ${activeTab === 'proposals' ? 'active' : ''}`} onClick={() => setActiveTab('proposals')}>
                📬 Cartitas {myProposals.length > 0 && <span style={{background: 'var(--palo-rosa)', color: 'white', padding: '2px 8px', borderRadius: '10px', fontSize: '0.75rem', marginLeft: '6px'}}>{myProposals.length}</span>}
              </button>
              <button className={`tab-btn ${activeTab === 'matches' ? 'active' : ''}`} onClick={() => setActiveTab('matches')}>❤️ Citas Match</button>
              <button className={`tab-btn ${activeTab === 'mural' ? 'active' : ''}`} onClick={() => setActiveTab('mural')}>🧷 Mural de los Deseos</button>
              <button className={`tab-btn ${activeTab === 'chat' ? 'active' : ''}`} onClick={() => setActiveTab('chat')}>💬 Chat</button>
              <button className={`tab-btn ${activeTab === 'corazometro' ? 'active' : ''}`} onClick={() => setActiveTab('corazometro')}>💗 Corazómetro</button>
            </div>

            <div className="tab-panel" key={activeTab}>
            {activeTab === 'connection' && (
              <div className="card">
                <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>💍 Conexión de Novios y Apodos Cariñosos</h3>
                <p style={{color: 'var(--text-muted)', fontSize: '0.92rem'}}>Personaliza vuestros apodos para reflejar vuestro amor en toda la aplicación.</p>
                
                <form onSubmit={updateNickname} style={{marginTop: '25px', background: '#fcfafb', padding: '24px', borderRadius: '16px', border: '1px solid var(--border-color)'}}>
                  <label>Apodo que TÚ le pones a {partnerNick}:</label>
                  <input type="text" value={partnerNickInput} onChange={e => setPartnerNickInput(e.target.value)} placeholder={`Ej. Mi Amor, Mi Rey... (actual: ${partnerNick})`} />
                  <label>Apodo que tu pareja te pone a ti:</label>
                  <input type="text" value={myNickname} onChange={e => setMyNickname(e.target.value)} placeholder={`Ej. Mi Amor, Mi Rey... (actual: ${myNick})`} />
                  <button className="action-btn" type="submit">Guardar Apodos ❤️</button>
                </form>

                <div style={{marginTop: '30px', textAlign: 'center', background: 'linear-gradient(135deg, #fff0f3, #ffe5ec)', padding: '30px', borderRadius: '20px', border: '1px solid var(--palo-rosa-light)'}}>
                  <div style={{fontSize: '3rem', marginBottom: '10px', animation: 'pulseHeart 2s infinite'}}>👩‍❤️‍👨</div>
                  <h4 style={{fontFamily: 'Playfair Display', fontSize: '1.5rem', color: 'var(--palo-rosa-dark)', margin: '0 0 10px 0'}}>Conexión de Novios</h4>
                  <p style={{fontSize: '1.1rem', margin: '5px 0'}}>Enamorados: <strong>{myNick}</strong> & <strong>{partnerNick}</strong> ✨</p>
                  <span className="badge" style={{marginTop: '12px', background: 'var(--palo-rosa)', color: 'white', padding: '8px 20px', fontSize: '0.85rem'}}>Match Activo y Protegido con Amor ❤️</span>
                  <div style={{marginTop: '25px'}}>
                    <button className="action-btn delete-btn" style={{width: 'auto', display: 'inline-block', padding: '10px 24px'}} onClick={disconnectCouple}>
                      Romper / Borrar Match de Novios 💔
                    </button>
                  </div>
                  {loveMsg && (
                    <div className="love-msg" key={loveMsg}>
                      <div style={{fontSize: '2.2rem', marginBottom: '8px'}}>💞</div>
                      <p>{loveMsg}</p>
                      <button className="secondary-btn" style={{width: 'auto', display: 'inline-block', padding: '8px 20px'}} onClick={() => setLoveMsg('')}>Cerrar 💕</button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'wishlist' && (
              <div>
                <div className="card">
                  <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>✨ Agregar Nuevo Lugar a la Wishlist</h3>
                  <form onSubmit={addWishlistItem}>
                    <label>Título del lugar o actividad</label>
                    <input type="text" placeholder="Ej. Cena Romántica / Café en el parque" value={newTitle} onChange={e => setNewTitle(e.target.value)} required />
                    
                    <label>Descripción</label>
                    <textarea placeholder="Detalles o notas especiales..." value={newDesc} onChange={e => setNewDesc(e.target.value)} rows="3"></textarea>
                    
                    <label>Categoría</label>
                    <select value={newCategory} onChange={e => setNewCategory(e.target.value)}>
                      <option value="Restaurante">Restaurante 🍝</option>
                      <option value="Viaje">Viaje 🌊</option>
                      <option value="Café">Café ☕</option>
                      <option value="Paseo">Paseo 🌸</option>
                    </select>
                    <button className="action-btn" type="submit">Agregar a la Wishlist</button>
                  </form>
                </div>

                <h2 style={{fontWeight: 600, fontFamily: 'Playfair Display', fontSize: '1.6rem', marginBottom: '20px', color: 'var(--text-main)'}}>Citas Soñadas</h2>
                <div className="grid">
                  {data.wishlist.map(item => (
                    <div className="wishlist-item" key={item.id}>
                      {editingId === item.id ? (
                        <form onSubmit={saveWishlistEdit} className="wishlist-edit">
                          <div style={{fontSize: '2.2rem', marginBottom: '6px'}}>✏️</div>
                          <label>Título del lugar</label>
                          <input type="text" value={editTitle} onChange={e => setEditTitle(e.target.value)} required />
                          <label>Descripción</label>
                          <textarea value={editDesc} onChange={e => setEditDesc(e.target.value)} rows="3"></textarea>
                          <label>Categoría</label>
                          <select value={editCategory} onChange={e => setEditCategory(e.target.value)}>
                            <option value="Restaurante">Restaurante 🍝</option>
                            <option value="Viaje">Viaje 🌊</option>
                            <option value="Café">Café ☕</option>
                            <option value="Paseo">Paseo 🌸</option>
                          </select>
                          <button className="action-btn" type="submit">Guardar cambios ✨</button>
                          <button className="secondary-btn" type="button" onClick={() => setEditingId(null)}>Cancelar</button>
                        </form>
                      ) : (
                        <>
                          <div>
                            <div style={{fontSize: '2.8rem', marginBottom: '10px'}}>{item.image}</div>
                            <h3 style={{margin: '5px 0 8px 0', fontSize: '1.2rem', fontWeight: 600, fontFamily: 'Playfair Display'}}>{item.title}</h3>
                            <span className="badge">{item.category}</span>
                            <p style={{color: 'var(--text-muted)', fontSize: '0.9rem', margin: '10px 0'}}>{item.description}</p>
                            <p style={{fontSize: '0.75rem', color: '#b5838d', fontStyle: 'italic', margin: '0 0 15px 0'}}>Agregado por {item.addedBy}</p>
                          </div>
                          <div>
                            <button className="secondary-btn" onClick={() => startEditWishlist(item)}>
                              Editar ✏️
                            </button>
                            <button className="secondary-btn" onClick={() => { setProposalPlace(item.title); setActiveTab('propose'); }}>
                              Proponer esta cita 💌
                            </button>
                            <button className="action-btn delete-btn" onClick={() => deleteWishlistItem(item.id)}>
                              Eliminar 🗑️
                            </button>
                          </div>
                        </>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'freedays' && (
              <div className="card">
                <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>📅 Sincroniza tus Días Libres</h3>
                <form onSubmit={markFreeDay}>
                  <label>Selecciona un día libre:</label>
                  <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} required />
                  <button className="action-btn" type="submit">Registrar Día Libre</button>
                </form>

                <h3 style={{marginTop: '30px', fontWeight: 600, fontFamily: 'Playfair Display', fontSize: '1.3rem', color: 'var(--text-main)'}}>Disponibilidad en Pareja</h3>
                {data.freeDays.length === 0 ? (
                  <p style={{color: 'var(--text-muted)', fontStyle: 'italic'}}>Aún no hay días libres registrados.</p>
                ) : (
                  <ul style={{listStyle: 'none', padding: 0, marginTop: '15px'}}>
                    {data.freeDays.map((d, index) => (
                      <li key={index} style={{background: '#fcfafb', border: '1px solid var(--border-color)', padding: '14px 20px', borderRadius: '14px', marginBottom: '12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                        <span>👤 <strong>{d.user}</strong> está libre</span>
                        <span className="badge">📅 {d.date}</span>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            )}

            {activeTab === 'propose' && (
              <div className="card">
                <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>💌 Enviar Propuesta a tu Novio/a</h3>
                <form onSubmit={sendProposal}>
                  <label>Enviar a:</label>
                  <input type="text" value={`${partnerNick} (${partnerName})`} disabled style={{background: '#f3f4f6', cursor: 'not-allowed', fontWeight: '500'}} />

                  <label>Lugar o Actividad:</label>
                  <input type="text" placeholder="Ej. Cena Romántica" value={proposalPlace} onChange={e => setProposalPlace(e.target.value)} required />
                  
                  <label>Fecha Propuesta:</label>
                  <input type="date" value={proposalDate} onChange={e => setProposalDate(e.target.value)} required />
                  
                  <label>Mensaje:</label>
                  <textarea placeholder="Escribe un mensaje especial..." value={proposalMessage} onChange={e => setProposalMessage(e.target.value)} rows="4" required></textarea>
                  
                  <button className="action-btn" type="submit">Enviar Propuesta 💌</button>
                </form>
              </div>
            )}

            {activeTab === 'proposals' && (
              <div>
                <h2 style={{fontWeight: 600, fontFamily: 'Playfair Display', fontSize: '1.6rem', marginBottom: '20px', color: 'var(--text-main)'}}>📬 Propuestas y Cartitas</h2>
                {myProposals.length === 0 ? (
                  <div className="card" style={{textAlign: 'center', padding: '45px'}}>
                    <div style={{fontSize: '3.5rem', marginBottom: '15px', animation: 'floatEnvelope 3s infinite'}}>💌</div>
                    <p style={{color: 'var(--text-muted)'}}>No tienes cartitas pendientes por revisar en este momento.</p>
                  </div>
                ) : (
                  myProposals.map(prop => (
                    <div className="envelope-card" key={prop.id}>
                      <div className="envelope-icon">💌</div>
                      <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>¡Te ha llegado una cartita de {prop.sender}!</h3>
                      <p><strong>Lugar:</strong> {prop.place}</p>
                      <p><strong>Fecha:</strong> {prop.date}</p>
                      <p style={{background: 'rgba(255,255,255,0.9)', padding: '18px', borderRadius: '14px', border: '1px solid var(--border-color)', fontStyle: 'italic'}}>"{prop.message}"</p>
                      <div style={{display: 'flex', gap: '15px', marginTop: '20px'}}>
                        <button className="action-btn" style={{background: '#10b981', margin: 0, padding: '12px'}} onClick={() => respondProposal(prop.id, 'accept')}>Aceptar ❤️</button>
                        <button className="secondary-btn delete-btn" style={{margin: 0, padding: '12px'}} onClick={() => respondProposal(prop.id, 'reject')}>Rechazar</button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab === 'matches' && (
              <div>
                <h2 style={{fontWeight: 600, fontFamily: 'Playfair Display', fontSize: '1.6rem', marginBottom: '20px', color: 'var(--text-main)'}}>❤️ Citas Confirmadas</h2>
                {data.matches.length === 0 ? (
                  <div className="card" style={{textAlign: 'center', padding: '45px'}}>
                    <p style={{color: 'var(--text-muted)'}}>Aún no hay citas confirmadas.</p>
                  </div>
                ) : (
                  <div className="grid">
                    {data.matches.map(m => (
                      <div className="card" key={m.id} style={{display: 'flex', flexDirection: 'column', justifyContent: 'space-between'}}>
                        <div>
                          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px'}}>
                            <span className="badge" style={{margin: 0}}>Confirmada ✨</span>
                            <span style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>{m.sender}</span>
                          </div>
                          <h3 style={{margin: '8px 0', fontSize: '1.2rem', fontWeight: 600, fontFamily: 'Playfair Display'}}>{m.place}</h3>
                          <p style={{margin: '4px 0', color: 'var(--text-muted)', fontSize: '0.9rem'}}>📅 {m.date}</p>
                          {m.message && <p style={{background: '#fcfafb', padding: '12px', borderRadius: '10px', fontSize: '0.88rem', fontStyle: 'italic', margin: '12px 0'}}>"{m.message}"</p>}
                        </div>
                        <button className="action-btn delete-btn" onClick={() => deleteMatch(m.id)}>
                          Eliminar Cita 🗑️
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'chat' && (
              <ChatPanel
                messages={data.chat || []}
                streak={data.streak || { count: 0, todayDone: false }}
                me={user.name}
                partnerNick={partnerNick}
                chatText={chatText}
                setChatText={setChatText}
                showEmojis={showEmojis}
                setShowEmojis={setShowEmojis}
                chatRef={chatRef}
                emojis={CHAT_EMOJIS}
                quick={CHAT_QUICK}
                onSend={sendChat}
              />
            )}

            {activeTab === 'corazometro' && (
              <Corazometro {...calcLove()} partnerNick={partnerNick} myNick={myNick} />
            )}

            {activeTab === 'mural' && (
              <div>
                <h2 style={{fontWeight: 600, fontFamily: 'Playfair Display', fontSize: '1.6rem', marginBottom: '6px', color: 'var(--text-main)'}}>🧷 Mural de los Deseos</h2>
                <p style={{color: 'var(--text-muted)', fontStyle: 'italic', marginTop: 0}}>Pega aquí tus notitas diarias de amor para {partnerNick} 💕</p>

                <form onSubmit={addNote} className="card" style={{display: 'flex', flexDirection: 'column', gap: '12px'}}>
                  <textarea value={noteText} onChange={e => setNoteText(e.target.value)} placeholder="Escribe una notita romántica... 💌" rows="3" maxLength={300}></textarea>
                  <div style={{display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap'}}>
                    <label style={{margin: 0}}>Color:</label>
                    {NOTE_COLORS.map(c => (
                      <button type="button" key={c} onClick={() => setNoteColor(c)} aria-label="Color de la notita"
                        style={{width: 28, height: 28, borderRadius: '50%', background: c, cursor: 'pointer', border: noteColor === c ? '3px solid var(--palo-rosa-dark)' : '2px solid white', boxShadow: '0 2px 6px rgba(0,0,0,0.1)'}}></button>
                    ))}
                    <button className="action-btn" type="submit" style={{width: 'auto', marginLeft: 'auto', padding: '10px 22px'}}>Pegar notita 📌</button>
                  </div>
                </form>

                {(data.notes || []).length === 0 ? (
                  <p style={{textAlign: 'center', color: 'var(--text-muted)', marginTop: '40px'}}>Aún no hay notitas. ¡Pega la primera! 💌</p>
                ) : (
                  <div className="mural-grid">
                    {data.notes.map((n, i) => (
                      <div className="sticky-note" key={n.id} style={{background: n.color, '--rot': `${((i * 7) % 7) - 3}deg`, animationDelay: `${Math.min(i, 8) * 0.06}s`}}>
                        <div className="pin">📌</div>
                        <p>{n.text}</p>
                        <div className="note-foot">
                          <span>— {n.author}</span>
                          <span>{new Date(n.createdAt).toLocaleDateString('es-ES', {day: 'numeric', month: 'short'})}</span>
                        </div>
                        <button className="note-del" onClick={() => deleteNote(n.id)} title="Quitar notita">✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
